      - generic [ref=f7e233]:
        - paragraph [ref=f7e234]: About
        - heading "Engineer for intelligent systems, end to end." [level=2] [ref=f7e235]
      - generic [ref=f7e236]:
        - img "Portrait of Abdul Samad, Agentic AI Engineer based in Karachi, Pakistan" [ref=f7e239]
        - generic [ref=f7e240]:
          - paragraph [ref=f7e241]: I'm Abdul Samad, an Agentic AI Engineer and Forward Deployed Engineer based in Karachi, Pakistan. I build practical intelligent systems — autonomous agents that do real work, multi-agent architectures that cooperate on hard problems, and retrieval pipelines that keep AI answers grounded in real material instead of generated guesses.
          - paragraph [ref=f7e242]: "With 4 years of overall professional experience, I work comfortably across the whole stack: Python and FastAPI services, React and Next.js applications, Flutter mobile apps, PostgreSQL and vector databases, and the deployment pipelines that hold everything together. Anthropic's Model Context Protocol has become my standard way of connecting agents to the external world — I run MCP servers I built for Instagram, WordPress and programmatic video."
          - paragraph [ref=f7e243]: "What draws me to Forward Deployed Engineering is the full arc: sitting with a customer's operational problem, translating it into an architecture, prototyping fast, and then shipping and maintaining the thing in production. I've built agent harnesses with execution loops, tool permissions, checkpointing and human-in-the-loop approvals, and I care about the unglamorous parts — evaluation, guardrails, observability — because that's what makes agents trustworthy."
          - paragraph [ref=f7e244]: "My professional development is continuous and verifiable: 32 certificates from Anthropic, Microsoft, IBM, Adobe and HP, including Anthropic's complete AI Fluency and Claude development tracks."
