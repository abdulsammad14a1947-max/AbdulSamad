    - generic [ref=f6e48]:
      - generic [ref=f6e49]:
        - generic [ref=f6e50]:
          - heading "01 The problem" [level=2] [ref=f6e51]:
            - generic [ref=f6e52]: "01"
            - text: The problem
          - paragraph [ref=f6e53]: Manual fraud review does not scale. Transactions arrive in real time, fraudsters switch tactics — device spoofing, IP anomalies, velocity abuse, synthetic identities — and human reviewers need to understand why a transaction was flagged, not just that it was flagged. The goal was a system that could evaluate every transaction instantly, from multiple independent analytical angles, and still produce explainable decisions with a full audit trail.
        - generic [ref=f6e54]:
          - heading "02 The solution" [level=2] [ref=f6e55]:
            - generic [ref=f6e56]: "02"
            - text: The solution
          - paragraph [ref=f6e57]: "A FastAPI backend built around a multi-agent orchestration layer. Each transaction is dispatched to specialized agents in parallel — behavior, biometric, network, device, transaction, identity, account, graph, and threat intelligence agents — each scoring a specific risk dimension. An orchestrator agent aggregates the outputs using configurable weighted scoring, applies business rules and thresholds through a rules engine, and produces one of three decisions: approve, reject, or manual review. A compliance guardrail agent validates every decision against policy before it leaves the system."
        - generic [ref=f6e58]:
          - heading "03 System architecture" [level=2] [ref=f6e59]:
            - generic [ref=f6e60]: "03"
            - text: System architecture
          - list [ref=f6e61]:
            - listitem [ref=f6e62]: ▹ Ingestion & capture — checkout and API gateway events flow into the fraud service, with real-time transmission capture and payment capture endpoints.
            - listitem [ref=f6e63]: ▹ Parallel agent execution — 10 specialized agents analyze the same transaction simultaneously across behavioral, biometric, network, device, identity, account, graph, and threat dimensions.
            - listitem [ref=f6e64]: ▹ Orchestration — an orchestrator agent re-runs aggregation, validates values, and coordinates a business rules engine with weighted scoring per agent (behavior 20%, biometric 10%, network 15%, device 15%, identity 10%, account 10%, graph 10%, explainability 9%).
            - listitem [ref=f6e65]: "▹ Risk engine & decision — weighted scores combine into a composite risk score mapped to thresholds: <0.3 approve, 0.3–0.7 approve with monitoring, 0.7–1.0 manual review, ≥1.0 reject."
            - listitem [ref=f6e66]: ▹ Explainability agent — generates human-readable reasoning so reviewers see exactly which signals drove each decision.
            - listitem [ref=f6e67]: ▹ Persistence & audit — decision records, audit logs, embeddings, and real-time websocket events are stored in PostgreSQL with Qdrant used for vector similarity.
        - figure [ref=f6e68]:
          - img "Multi-Agent Fraud Detection System — system architecture diagram" [ref=f6e69]
        - figure [ref=f6e70]:
          - img "Multi-Agent Fraud Detection System — system architecture diagram" [ref=f6e71]
        - generic [ref=f6e72]:
          - heading "04 Implementation details" [level=2] [ref=f6e73]:
            - generic [ref=f6e74]: "04"
            - text: Implementation details
          - list [ref=f6e75]:
            - listitem [ref=f6e76]: ▹ OpenAI Agents SDK for agent definitions, delegation and tool calling.
            - listitem [ref=f6e77]: ▹ NetworkX for the transaction relationship graph — linked accounts, devices, IPs and shared signals feed the graph intelligence agent.
            - listitem [ref=f6e78]: ▹ FastAPI with Pydantic v2 schemas, SQLAlchemy models, JWT authentication with RBAC, and WebSocket channels for live risk events.
            - listitem [ref=f6e79]: ▹ Compliance guardrail layer with safety policies, bias & fairness rules, compliance rules, human-review policies, thresholds and escalation config.
            - listitem [ref=f6e80]: ▹ Data validation service plus fraud-pattern and velocity-checker tools, secured access, PII masking and encryption for sensitive fields.
            - listitem [ref=f6e81]: ▹ Automated test suites covering scenarios, validation service and guardrails — the evolving build progressed from a 6-agent / 35-test iteration to the full 10-agent platform.
        - generic [ref=f6e82]:
          - heading "05 What it delivers" [level=2] [ref=f6e83]:
            - generic [ref=f6e84]: "05"
            - text: What it delivers
          - list [ref=f6e85]:
            - listitem [ref=f6e86]: ▹ Every transaction is scored across 10 independent analytical dimensions with a single explainable composite decision.
            - listitem [ref=f6e87]: ▹ Configurable weighted scoring and thresholds mean risk appetite changes are configuration changes, not rewrites.
            - listitem [ref=f6e88]: "▹ Full decision transparency: audit logs, agent reasoning and per-agent weights/latency/accuracy are observable."
            - listitem [ref=f6e89]: ▹ Guardrail-validated outputs with human-in-the-loop manual review for high-risk cases.
