      - paragraph [ref=f6e35]: Multi-Agent AI · Backend Security
      - heading "Multi-Agent Fraud Detection System" [level=1] [ref=f6e36]
      - paragraph [ref=f6e37]: A multi-agent detection platform where 10 specialized AI agents analyze every transaction in parallel, orchestrated by a weighted scoring engine.
      - generic [ref=f6e38]:
        - generic [ref=f6e39]: Internal / client build
        - generic [ref=f6e40]: FastAPI
        - generic [ref=f6e41]: OpenAI Agents SDK
        - generic [ref=f6e42]: Python 3.12+
