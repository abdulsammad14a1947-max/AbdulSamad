      - paragraph [ref=f36e21]: Full-Stack · AI Application
      - heading "HCM Lite — AI-Powered HR Management" [level=1] [ref=f36e22]
      - paragraph [ref=f36e23]: A complete human-capital-management platform for Admin, HR and Employee roles — attendance, leaves, payroll and an AI assistant that answers real questions about company data.
      - generic [ref=f36e24]:
        - generic [ref=f36e25]: Shipped product
        - generic [ref=f36e26]: React
