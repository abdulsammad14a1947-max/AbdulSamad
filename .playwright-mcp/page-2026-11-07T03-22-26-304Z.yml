        - generic [ref=f36e33]: JWT Authentication
    - generic [ref=f36e34]:
      - generic [ref=f36e35]:
        - generic [ref=f36e36]:
          - heading "01 The problem" [level=2] [ref=f36e37]:
            - generic [ref=f36e38]: "01"
            - text: The problem
          - paragraph [ref=f36e39]: Small and mid-sized organizations run HR work — employee records, attendance, leave requests, payroll preparation — across disconnected spreadsheets and ad-hoc files. Every question ("who is on leave today?", "what is my leave balance?", "is payroll ready?") turns into a manual hunt across files, and none of it is auditable. Smaller teams don't need enterprise SAP-grade suites; they need one connected system that still enforces role-appropriate access.
        - generic [ref=f36e40]:
          - heading "02 The solution" [level=2] [ref=f36e41]:
            - generic [ref=f36e42]: "02"
            - text: The solution
          - paragraph [ref=f36e43]: "HCM Lite: an AI-powered HR management system with three strictly separated roles. Admin has full control, company analytics and payroll finalization. HR manages employee records, approves leaves and prepares payroll. Employees self-serve check-in/out, leave applications and payslips. On top of the operational layer, a Smart AI Assistant (OpenAI GPT-4o) answers natural-language questions from real company data — dashboard summaries, leave balances, policy Q&A and data insights — wired through explicit AI-tool permissions so it only ever surfaces what the asking role is allowed to see."
        - generic [ref=f36e44]:
          - heading "03 System architecture" [level=2] [ref=f36e45]:
            - generic [ref=f36e46]: "03"
            - text: System architecture
          - list [ref=f36e47]:
            - listitem [ref=f36e48]: "▹ Frontend — React + Next.js with Tailwind CSS: a modern, responsive UI with role-based dashboards (Admin / HR / Employee, each with its own views and actions)."
            - listitem [ref=f36e49]: "▹ Backend — Python (FastAPI) plus Node.js holding the business logic: authentication and authorization, API endpoints, and rules for attendance, leaves and payroll."
            - listitem [ref=f36e50]: ▹ AI layer — OpenAI GPT-4o smart assistant with tool permissions limited to Dashboard Summary, Smart Leave, Policy Q&A and Data Insights.
            - listitem [ref=f36e51]: ▹ Security layer — JWT authentication, role-based access control, data privacy and secured APIs; HR approves what HR should approve, employees see only their own data.
            - listitem [ref=f36e52]: ▹ Database layer — Employee, attendance, leave and payroll records with settings and logs; PostgreSQL, MongoDB and Firebase used across the stack.
            - listitem [ref=f36e53]: ▹ Camera attendance — camera check-in verified against an in-office location radius.
        - figure [ref=f36e54]:
          - img "HCM Lite — AI-Powered HR Management — system architecture diagram" [ref=f36e55]
        - figure [ref=f36e56]:
          - img "HCM Lite — AI-Powered HR Management — system architecture diagram" [ref=f36e57]
        - generic [ref=f36e58]:
          - heading "04 Implementation details" [level=2] [ref=f36e59]:
            - generic [ref=f36e60]: "04"
            - text: Implementation details
          - list [ref=f36e61]:
            - listitem [ref=f36e62]: "▹ Role-based dashboards: Admin (full control, company analytics, finalize payroll, total-employee overview), HR (manage employees, approve leaves, prepare payroll, pending-leave queue) and Employee (check in/out, apply for leave, view payslip, leave balance)."
            - listitem [ref=f36e63]: "▹ Nine modules covering 25+ features: employee management, attendance with camera check-in, leave management, payroll and payslips, analytics dashboards, AI assistant and secure three-role access."
            - listitem [ref=f36e64]: ▹ AI assistant connects to live data rather than static text — asking "how many employees are on leave today?" returns the real count with a breakdown by leave type.
            - listitem [ref=f36e65]: "▹ Camera attendance as a bonus track: face matching plus location verification (in-office radius check) before check-in is accepted."
            - listitem [ref=f36e66]: "▹ Guided 5-step operating flow: Admin sets up the company → HR registers employees → employees use the system → HR approves and processes → everyone gets AI insights."
        - generic [ref=f36e67]:
          - heading "05 What it delivers" [level=2] [ref=f36e68]:
            - generic [ref=f36e69]: "05"
            - text: What it delivers
          - list [ref=f36e70]:
            - listitem [ref=f36e71]: ▹ One connected system that ends the spreadsheet version of HR for the organization.
            - listitem [ref=f36e72]: ▹ Every record — attendance, leave, payroll — lives in real data, not ad-hoc files, and feeds the analytics dashboards.
            - listitem [ref=f36e73]: "▹ The AI assistant turns operations into answers: leave counts, balances, policy questions and payroll summaries in plain language, always scoped by role."
            - listitem [ref=f36e74]: ▹ Role separation enforced technically (JWT + role-based access), not just by UI convention.
